# CI for this fork branch only. v0.8.0 predates the workflows on upstream
# master, so without this the branch gets no coverage at all, and the unified
# sighash work here is only ever run locally on one Python version.
#
# Not for upstream: a proposal against master inherits master's CI.
name: CI

on:
  push:
    branches:
      - unified-sighash-v0.8.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      # tests/integration needs a running Bitcoin node; the unit tests do not
      - name: Tests
        run: python -m pytest tests/tests -q -o addopts=""
